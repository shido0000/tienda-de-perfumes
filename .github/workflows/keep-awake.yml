name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          SITE_URL: ${{ vars.RENDER_SITE_URL }}
        run: |
          test -n "$SITE_URL"
          curl --fail --silent --show-error --connect-timeout 15 --max-time 120 \
            "${SITE_URL%/}/api/health" >/dev/null
