name: Deploy Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./dev.db
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply D1 schema
        run: npx wrangler d1 migrations apply tienda-perfumes-db --remote -y

      - name: Prepare admin seed
        env:
          SEED_ADMIN_EMAIL: ${{ vars.SEED_ADMIN_EMAIL || 'jonyperez1099@gmail.com' }}
          SEED_ADMIN_PASSWORD_HASH: ${{ secrets.SEED_ADMIN_PASSWORD_HASH }}
        run: npm run db:seed:admin:ci -- "$RUNNER_TEMP/admin-seed.sql"

      - name: Apply admin seed
        run: npx wrangler d1 execute tienda-perfumes-db --remote --file "$RUNNER_TEMP/admin-seed.sql" -y

      - name: Build Worker
        run: npm run build:worker

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            JWT_SECRET
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
