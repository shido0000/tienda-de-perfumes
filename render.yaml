previews:
  generation: off

services:
  - type: web
    name: tienda-de-perfumes
    runtime: node
    plan: 1c-2g
    region: oregon
    branch: main
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        value: file:./dev.db
      - key: RENDER
        value: "true"
      - key: NEXT_PUBLIC_SITE_URL
        value: https://tienda-de-perfumes.onrender.com
      - key: D1_PROXY_URL
        value: https://tienda-de-perfumes.jonyperez1099.workers.dev/api/internal/d1
      - key: D1_PROXY_TOKEN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GOOGLE_SITE_VERIFICATION
        sync: false
